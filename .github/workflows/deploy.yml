name: Deploy ke GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # URL dan kunci publishable memang publik; data dilindungi RLS (supabase/schema.sql)
          VITE_SUPABASE_URL: https://fxtdejfvbpsktfkjvkct.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_P0KceOPiKoPS9J5lTTk1hQ_LTeIFgae
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
